<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mici Színező</title>
  <meta name="description" content="Színező és rajzoló app iPadre: kifesthető képek, többféle ecset, csillámos és szivárványos színek.">
  <meta name="theme-color" content="#E8EDFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mici Színező">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- APP:START -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="tip-rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A5A"/><stop offset=".2" stop-color="#FFB23F"/><stop offset=".4" stop-color="#FFE14D"/>
      <stop offset=".6" stop-color="#5FD36A"/><stop offset=".8" stop-color="#4CB8FF"/><stop offset="1" stop-color="#9A63FF"/>
    </linearGradient>
  </defs>
</svg>

<section id="home" class="screen">
  <header class="brand">
    <h1 aria-label="Mici Színező">
      <span>M</span><span>i</span><span>c</span><span>i</span>
      <span class="gap"></span>
      <span>S</span><span>z</span><span>í</span><span>n</span><span>e</span><span>z</span><span>ő</span>
    </h1>
    <p>Válassz egy képet, és színezd ki!</p>
  </header>
  <div id="gallery" class="gallery"></div>
</section>

<section id="editor" class="screen" hidden>
  <div class="topbar">
    <button id="btn-home" class="round" aria-label="Vissza a képekhez"></button>
    <div class="spacer"></div>
    <button id="btn-undo" class="round" aria-label="Visszavonás" disabled></button>
    <button id="btn-clear" class="round" aria-label="Mindent letöröl"></button>
    <button id="btn-save" class="round accent" aria-label="Kép mentése"></button>
  </div>
  <aside class="panel side-tools">
    <div id="tools" class="tools"></div>
    <div id="sizes" class="sizes"></div>
  </aside>
  <main id="stage" class="stage">
    <div id="paper" class="paper">
      <canvas id="cv-paint"></canvas>
      <canvas id="cv-glitter"></canvas>
      <canvas id="cv-lines"></canvas>
    </div>
  </main>
  <aside class="panel side-colors">
    <div id="palette" class="palette"></div>
  </aside>
</section>

<div id="confirm" class="overlay" hidden>
  <div class="dialog">
    <p class="dialog-title">Letörlöd az egészet?</p>
    <div class="dialog-row">
      <button id="clear-no" class="big no" aria-label="Nem"></button>
      <button id="clear-yes" class="big yes" aria-label="Igen, törlöm"></button>
    </div>
  </div>
</div>

<div id="save-dialog" class="overlay" hidden>
  <div class="dialog dialog-save">
    <button id="save-close" class="round close" aria-label="Bezárás"></button>
    <p class="dialog-title">Kész a kép!</p>
    <img id="save-img" alt="Az elkészült rajz">
    <button id="save-share" class="pill" hidden><span>Mentés a Fotókba</span></button>
    <p class="hint">Vagy tartsd nyomva a képet, és válaszd a <b>Mentés a Fotókba</b> lehetőséget.</p>
  </div>
</div>
<!-- APP:END -->
<script src="drawings.js"></script>
<script src="app.js"></script>
</body>
</html>
